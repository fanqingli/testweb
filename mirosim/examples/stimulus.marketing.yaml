    label: "功能诉求 + 19 元"
    role: candidate
    content: "【新品】低糖鲜果茶，每杯糖含量不到同类一半，配料表只有五样。中杯 19 元。"
    attributes: {price: 19, appeal: "functional"}
  - variant_id: B
    label: "情绪诉求 + 19 元"
    role: candidate
    content: "【新品】下午三点，给自己一杯不用有负担的甜。低糖鲜果茶，中杯 19 元。"
    attributes: {price: 19, appeal: "emotional"}
  - variant_id: C
    label: "功能诉求 + 23 元"
    role: candidate
    content: "【新品】低糖鲜果茶，每杯糖含量不到同类一半，配料表只有五样。中杯 23 元。"
    attributes: {price: 23, appeal: "functional"}
  - variant_id: NEG
    label: "负对照：空泛文案 + 29 元"
    role: negative_control
    content: "【新品】全新升级，品质之选，引领健康新潮流。中杯 29 元。"
    attributes: {price: 29, appeal: "none"}
