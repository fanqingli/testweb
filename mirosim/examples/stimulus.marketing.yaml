stimulus_id: s_tea_launch_copy
pack: marketing
kind: copy
title: "某新茶饮品牌低糖系列上市文案与定价"
context:
  background: "一个中等价位的连锁茶饮品牌（下称「该品牌」）将推出低糖系列。人物此前对该品牌的印象取自其长期档案；档案里没有的，视为听说过但没喝过。"
  as_of_date: "2026-11-22"
  channel_plan:
    - {channel: short_video, reach: 0.35}
    - {channel: lifestyle_community, reach: 0.30}
    - {channel: outdoor, reach: 0.25}
    - {channel: ecommerce_feed, reach: 0.20}
    - {channel: offline_store, reach: 0.15}
variants:
