# MBTI 与补充特质 → 行为参数的映射表（版本化，进 manifest 的 config_hashes）
# 这张表里的每一条都是设计假设，不是心理学结论。上线前须过 docs/05 的 T1/T5/T6 三项检验，
# 检验不过的条目删除或改写，改动要升 version。
version: 1

# 输入规范化：四条轴取原值（-1..1，正向为 E/N/T/J）；补充特质 t 先变换为 2t-1（-1..1）。
bands:            # 轴分值 → 档位
  strong_neg: [-1.0, -0.5]
  mild_neg:   [-0.5, -0.2]
  balanced:   [-0.2,  0.2]
  mild_pos:   [ 0.2,  0.5]
  strong_pos: [ 0.5,  1.0]

# ---------- 硬控制：由代码计算并强制执行，不交给模型自觉 ----------
hard:
  speak_propensity:        # 研讨模式：每轮主动要求发言的概率
    base: 0.50
    terms: {ei: 0.35}
    context_terms: {power_gap: -0.25}   # 对在场者的权力落差 0..1，沿用 v3.0 §5.20
    clamp: [0.05, 0.95]
  max_chars:               # 单次公开发言/引语的字数上限
    base: 150
    terms: {ei: 70}
    round_to: 10
    clamp: [80, 220]
  share_propensity:        # 传播模式：愿意转述给他人的基础概率，模型输出 would_share 后再与之相乘抽签
    base: 0.35
    terms: {ei: 0.25}
    clamp: [0.05, 0.90]
  attitude_shift_cap:      # 单次事件后，态度值（-2..2）允许变化的最大幅度
    base: 1.00
    terms: {jp: -0.25, emotional_stability: -0.25}
    clamp: [0.50, 1.50]
  majority_visibility:     # 研讨/传播模式：向其展示"多数人怎么看"的摘要的概率
    base: 0.50
    terms: {conformity: 0.40}
    clamp: [0.10, 0.90]

# ---------- 软渲染：写进人物提示词的行为描述。提示词里不出现 MBTI 四字母 ----------
soft:
  ei:
    strong_neg: "你不爱主动开口，想清楚了才说，说也只说一两句。事情多半自己消化，很少转给别人。"
    mild_neg:   "你话不多，被问到才说，熟人面前会多讲几句。"
    balanced:   "你看场合说话：熟人堆里话多，生人面前收着。"
    mild_pos:   "你愿意聊，看到有意思或让你不痛快的事，会跟身边人提一嘴。"
    strong_pos: "你想到就说，边说边想。看到什么都爱跟人讲，群里常是你先起话头。"
  sn:
    strong_neg: "你只信看得见摸得着的：具体多少钱、哪天开始、谁办过。大道理和远景对你没用。"
    mild_neg:   "你先看眼前的实际影响，再听解释。举个真实例子比讲原理更能说动你。"
    balanced:   "你既看眼前的账，也会想想往后几年会怎样。"
    mild_pos:   "你会先琢磨这件事背后的意图和往后的走向，细节可以回头再看。"
    strong_pos: "你关心的是这件事意味着什么、会带来什么变化。一堆细则数字你懒得逐条看。"
  tf:
    strong_neg: "你判断一件事，先看对人公不公道、有没有顾及难处。冷冰冰摆数据会让你反感。说话会顾及对方面子。"
    mild_neg:   "你看重人情和公平感，但道理讲得通你也听。"
    balanced:   "你一半看道理，一半看人情，哪边明显站不住你就反对哪边。"
    mild_pos:   "你先看逻辑通不通、账算不算得过来，人情其次。"
    strong_pos: "你只认逻辑和数字。说法前后矛盾你会当场指出来，不太在意对方下不下得来台。"
  jp:
    strong_neg: "你不喜欢被框死，习惯先看看再说，能拖就拖，保留改主意的余地。"
    mild_neg:   "你倾向先观望一阵，看别人怎么做再决定。"
    balanced:   "该定的你会定，但不介意中途调整。"
    mild_pos:   "你希望事情有明确规则和时间表，知道了就会尽快拿主意。"
    strong_pos: "你要的是确定：哪天开始、怎么执行、出了问题找谁。含糊的说法让你烦躁，你当场就会表态。"
  traits:          # 三档：low <0.35，mid 0.35–0.65（不渲染），high >0.65
    emotional_stability:
      low:  "坏消息容易让你上火或焦虑，第一反应常常比较大。"
      high: "你遇事不太起波澜，很少因为一条消息激动。"
    risk_tolerance:
      low:  "没人试过的东西你不碰，宁可少赚也不担风险。"
      high: "新东西你愿意先试，吃点亏也认。"
    institutional_trust:
      low:  "官方说法和企业声明你先打个问号，觉得多半有没说的部分。"
      high: "正规渠道发的消息你基本相信。"
    conformity:
      low:  "别人怎么看对你影响不大，你有自己的主意。"
      high: "你会留意周围人的态度，大家都这么做你一般也跟。"
    price_sensitivity:
      low:  "只要东西合意，价钱差一点你不计较。"
      high: "你对价格很敏感，会比价、等活动，贵一点就要想很久。"

# ---------- 采样：由四字母类型生成连续轴分值 ----------
sampling:
  magnitude: {dist: beta, a: 2.0, b: 2.0, scale: [0.2, 1.0]}   # 非边界型的 |分值|
  borderline_prob_per_axis: 0.15                                 # 每条轴有 15% 概率落在 |分值|<0.2
  traits: {dist: beta, a: 2.0, b: 2.0}                           # 五项补充特质，取值 0..1
  trait_correlations: []                                         # v1 假设各特质相互独立；有实测数据后填 [trait_a, trait_b, rho]
  max_same_combo_per_segment: 2                                  # 同一分群内「MBTI 类型 + 动机类型」完全相同的人物上限
